<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laura Vandendorpe</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap");

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      background: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: fit-content;
      max-width: calc(100% - 96px);
      margin: 0;
      padding: 36px 0 84px;
    }

    body {
      padding-left: 44px;
      padding-top: 20px;
    }

    .polaroids {
      display: grid;
      grid-template-columns: repeat(5, 108px);
      gap: 18px 16px;
    }

    .tagline {
      margin: 0 0 18px;
      color: rgba(0, 0, 0, 0.62);
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-size: 16px;
      line-height: 1.4;
    }

    .polaroid {
      width: 108px;
      padding: 8px 8px 28px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }

    .polaroid.story-trigger {
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .polaroid.story-trigger:hover,
    .polaroid.story-trigger:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
    }

    .polaroid.story-trigger:focus-visible {
      outline: 2px solid rgba(0, 0, 0, 0.12);
      outline-offset: 4px;
    }

    .polaroid img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      background: #f3f3f3;
    }

    .placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: rgba(0, 0, 0, 0.45);
      font-family: Arial, sans-serif;
      font-size: 8px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .polaroid figcaption {
      height: 24px;
      margin-top: 2px;
      padding-left: 0;
      color: #111111;
      line-height: 1;
      display: block;
    }

    .marker-title {
      width: 100%;
    }

    .marker-title-svg {
      display: block;
      width: 100%;
      height: 24px;
      overflow: visible;
      transform: translateY(4px);
    }

    .marker-title-svg text {
      fill: #111111;
      font-family: "Permanent Marker", "Marker Felt Wide", "Marker Felt", sans-serif;
      font-size: 18px;
      text-transform: uppercase;
      dominant-baseline: middle;
    }

    .story-overlay {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(255, 255, 255, 0.7);
      z-index: 20;
    }

    .story-overlay.is-open {
      display: flex;
    }

    .story-card {
      width: min(640px, calc(100vw - 48px));
      max-height: min(78vh, 760px);
      padding: 30px 34px 32px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 26px 50px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
    }

    .story-close {
      display: block;
      margin-left: auto;
      margin-bottom: 18px;
      padding: 0;
      border: 0;
      background: transparent;
      color: rgba(0, 0, 0, 0.48);
      font: inherit;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .story-title {
      margin: 0;
      font-family: "Permanent Marker", "Marker Felt Wide", "Marker Felt", sans-serif;
      font-size: 34px;
      line-height: 1;
      text-transform: uppercase;
    }

    .story-body {
      margin-top: 20px;
      color: rgba(0, 0, 0, 0.82);
      font-family: "Iowan Old Style", "Baskerville", "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.7;
      overflow: auto;
      padding-right: 10px;
    }

    .story-body p {
      margin: 0 0 18px;
      white-space: pre-line;
    }

    .story-body p:last-child {
      margin-bottom: 0;
    }

    .polaroid:nth-child(5n + 1) img {
      object-position: center 18%;
    }

    .polaroid:nth-child(5n + 2) img {
      object-position: center bottom;
    }

    .polaroid:nth-child(5n + 3) img {
      object-position: center 42%;
    }

    .story-trigger[data-story-id="generosity"] img {
      object-position: center 18%;
    }

    .story-trigger[data-story-id="courage"] img {
      object-position: center bottom;
    }

    .story-trigger[data-story-id="ignorance"] img {
      object-position: center 62%;
    }

    .story-trigger[data-story-id="joy"] img {
      object-position: center 34%;
    }

    .story-trigger[data-story-id="cool"] img {
      object-position: center 38%;
    }

    .polaroid:nth-child(5n + 4) img {
      object-position: center 58%;
    }

    .polaroid:nth-child(5n) img {
      object-position: center 72%;
    }

    @media (max-width: 980px) {
      main {
        max-width: calc(100% - 48px);
        padding-top: 28px;
        padding-bottom: 56px;
      }

      .polaroids {
        grid-template-columns: repeat(4, 108px);
      }
    }

    @media (max-width: 720px) {
      body {
        padding-left: 18px;
        padding-top: 14px;
      }

      main {
        max-width: calc(100% - 28px);
        padding: 24px 0;
      }

      .polaroids {
        grid-template-columns: repeat(3, 92px);
        gap: 14px 12px;
      }

      .polaroid {
        width: 92px;
        padding: 7px 7px 20px;
      }

      .polaroid figcaption {
        height: 18px;
        margin-top: 3px;
      }

      .marker-title-svg {
        height: 18px;
        transform: translateY(3px);
      }

      .marker-title-svg text {
        font-size: 14px;
      }

      .story-card {
        width: min(100vw - 28px, 640px);
        padding: 24px 22px 24px;
      }

      .story-title {
        font-size: 26px;
      }

      .story-body {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="tagline">Small stories behind the bigger things that matter to me.</p>
    <section class="polaroids" aria-label="Polaroid photos">
      <figure class="polaroid story-trigger" tabindex="0" data-story-id="courage"><img src="courage.jpeg" alt="Palm trees under a bright Los Angeles sky" /><figcaption class="marker-title"><svg class="marker-title-svg" viewBox="0 0 92 24" aria-label="Courage" role="img"><text x="46" y="12" text-anchor="middle" textLength="92" lengthAdjust="spacingAndGlyphs">Courage</text></svg></figcaption></figure>
      <figure class="polaroid story-trigger" tabindex="0" data-story-id="ignorance">
        <img src="ignorance-is-bliss.jpeg" alt="Ocean view from a hotel balcony with a pool and a small island offshore" />
        <figcaption class="marker-title">
          <svg class="marker-title-svg" viewBox="0 0 92 24" aria-label="Ignorance is Bliss" role="img">
            <text x="46" y="5" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs">Ignorance</text>
            <text x="46" y="21" text-anchor="middle" textLength="78" lengthAdjust="spacingAndGlyphs">is Bliss</text>
          </svg>
        </figcaption>
      </figure>
      <figure class="polaroid story-trigger" tabindex="0" data-story-id="generosity"><img src="generosity.jpeg" alt="Mattress in an empty room" /><figcaption class="marker-title"><svg class="marker-title-svg" viewBox="0 0 92 24" aria-label="Generosity" role="img"><text x="46" y="12" text-anchor="middle" textLength="92" lengthAdjust="spacingAndGlyphs">Generosity</text></svg></figcaption></figure>
      <figure class="polaroid story-trigger" tabindex="0" data-story-id="joy">
        <img src="joy-comes-in-the-morning.jpg" alt="American flag waving against a blue sky with mountains and pine trees behind it" />
        <figcaption class="marker-title">
          <svg class="marker-title-svg" viewBox="0 0 92 24" aria-label="Joy comes in the morning" role="img">
            <text x="46" y="5" text-anchor="middle" textLength="84" lengthAdjust="spacingAndGlyphs">Joy comes in</text>
            <text x="46" y="21" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs">the morning</text>
          </svg>
        </figcaption>
      </figure>
      <figure class="polaroid story-trigger" tabindex="0" data-story-id="cool">
        <img src="dont-be-cool.png" alt="A little girl in sunglasses standing outside with a very serious expression" />
        <figcaption class="marker-title">
          <svg class="marker-title-svg" viewBox="0 0 92 24" aria-label="Don't be cool" role="img">
            <text x="46" y="5" text-anchor="middle" textLength="82" lengthAdjust="spacingAndGlyphs">Don't be</text>
            <text x="46" y="21" text-anchor="middle" textLength="52" lengthAdjust="spacingAndGlyphs">cool</text>
          </svg>
        </figcaption>
      </figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
      <figure class="polaroid"><div class="placeholder">Loading</div><figcaption></figcaption></figure>
    </section>
  </main>
  <div class="story-overlay" id="story-overlay" aria-hidden="true">
    <article class="story-card" role="dialog" aria-modal="true" aria-labelledby="story-title">
      <button class="story-close" type="button" aria-label="Close story">&times;</button>
      <h2 class="story-title" id="story-title"></h2>
      <div class="story-body" id="story-body"></div>
    </article>
  </div>
  <script>
    const overlay = document.getElementById("story-overlay");
    const storyTitle = document.getElementById("story-title");
    const storyBody = document.getElementById("story-body");
    const closeButton = overlay.querySelector(".story-close");
    const triggers = document.querySelectorAll(".story-trigger");
    const stories = {
      generosity: {
        title: "Generosity",
        paragraphs: [
          "Someone at church once described real generosity as \"giving till it hurts a lil' - and then coming out the other end cheerful and relieved\". I think about that a lot. God loves a cheerful giver.",
          "When I came to America at 25, with $20K in my bank account, I knew that wasn't a lot in this new world. Money felt scarce. I had never let money, or my lack thereof, stop me from chasing my dreams, but this time it felt like a stretch.",
          "My first purchase was a motel. At $200 a night, it felt like a splurge until I saw the very humble furnishings and realized I could barely cram my equally humble belongings, two suitcases with some clothes and pictures, into the tiny bedroom. But hey, I had arrived.",
          "It took me two weeks, aka 20% of my net worth, and tens of rejections to get out of that motel and into an apartment. I needed someone to accept my non-existent credit score and believe that yes, I was employed, and no, I did not have a father or a husband as a guarantor.",
          "Just like that, $20K had become $10K after I paid a higher security deposit to convince the landlord that I'd be good for the lease. First order of business: buying a mattress. Everything else could wait until after my first paycheck.",
          "Jared the mattress seller, bless his heart, was an absolute legend. He convinced me it was OK not to compromise on my back pain, but also understood my financial predicament. He offered me his best showroom model at a steep discount because of a few fabrication faults and, really, because he felt bad for me. I had a roof over my head and a mattress under my body. The dream.",
          "My next step was to make the most of the month I had before starting work. My belongings, still just two suitcases and now a mattress, were safe and sound in my apartment, and I figured it would be cheaper to cross the border than survive another month in LA without a salary.",
          "So I took the cheapest flight to Puerto Escondido, surfer's paradise, booked a hostel for $20 a night, and signed up for some surf lessons. Well within my now remaining $8K budget. After getting food poisoning on day one, I had to temporarily splurge on a $30 a night private room to spare my roommates, which I made up for by rationing my post-surf cocos on the beach. What a life.",
          "I had never felt more rich and more broke at the same time. In Puerto Escondido standards, I was living like a queen. But watching my bank account drop below $5K, knowing I still had to buy a car in LA and survive another month without a paycheck, kept me up at night.",
          "At the end of the month, more tan and slightly less terrible at surfing, I said goodbye to my surf teacher. I asked him whether I could come visit again in 10 years and what would become of him by then. With a sparkle in his eye, he told me about his dream of having his own surf school one day. If only it weren't so damn impossible to buy the first surfboard that would get him started.",
          "With the couple dollars a day the surf school paid him, he could never save up for that first board, the one thing that could finally buy him the freedom to start earning on his own and build a business.",
          "I was in a rush to the airport, but negotiated that he would take me, my salty hair, and my backpack on the back of his scooter, with one stop on the way. We stopped at the surf shop, and I bought him a $900 surfboard.",
          "I knew that meant PB&J sandwiches for the rest of the month, and the car would have to wait. But all that felt so small compared to changing the course of his life. And I kinda love PB&J.",
          "It definitely hurt. I was scared to swipe that card. But the joy of loosening my grip, doing it anyway, and trusting in abundance, there is simply nothing like it. A cheerful and hopeful giver I was. And will try to be, always."
        ]
      },
      courage: {
        title: "Courage",
        paragraphs: [
          "I always had a wild dream of moving to the US. Probably watched too many Hollywood movies growing up on the countryside in Belgium. Even in primary school, I had these visions of a BIG life waiting on the other side. I thought my life would only really begin once I was playing in the bigger leagues. Oh I wish 7-year old me could see me now.",
          "After living in London for three years, I had made it out of small town Belgium, but not quite yet to the New World. Then the perfect opportunity to cross the pond presented itself: my then-boyfriend got a job offer in Los Angeles. I liked the sound of palm trees and decided it was time to dust off my American Dream.",
          "I applied for my visa and, as fate would have it, shortly after I got the good news, my boyfriend's job offer fell through. He could no longer join me on this Californian adventure. It was an emotional roller coaster, and somewhere in the middle of it, we realized we weren't right for each other. So we split up.",
          "But now I had a visa. And my old bag of dreams.",
          "So I decided to go anyway.",
          "Better an oops than a what if. After all, what did I really have to lose at 25?",
          "So I went. Against the advice of my family, friends, heck, even my therapist thought it was a dumb idea. And I'd be lying if I said I didn't think they were right at many of the soul-crushing low points I had no idea were coming my way.",
          "There were severe car crashes, each one resulting in the total loss of my hard-earned secondhand cars (I swear none of them were my fault!). There were countless encounters with homeless people, some violent, one ending in an actual fist fight and me getting my keys back. There were car break-ins, being stood up on first dates, starting book clubs with no-one showing up and spending countless nights alone crying on the bathroom floor.",
          "And yet.",
          "There were also so many moments when I felt, deep in my bones, that they were wrong.",
          "Not just because there were green lights along the way, actual dolphins appearing while surfing before work, birthdays celebrated on boats, lifelong friends, an incredible church community. But because this life, in all its chaos, made me come more alive.",
          "That's the thing about courage. It doesn't always get rewarded in linear form. It often leads to getting your ass kicked, and needing to show even more courage.",
          "Life is a ride to go on. A question to which the answer is always yes. Your adventure to live out, one time only.",
          "Forever grateful to that whisper of courage that made me ignore all the other voices and just go. Would do it all again."
        ]
      },
      ignorance: {
        title: "Ignorance is Bliss",
        paragraphs: [
          "Sometimes you're just better off not knowing.",
          "I lived in Mexico City for five months, story for another time, and was flying from LAX to CDMX. Halfway through the flight, the tracker went offline. By the time we landed, the pilot told us we had not landed in CDMX at all because the airport was flooded again. We were in Mazatlan.",
          "With no internet on my phone and no cash in hand, I had no idea what to expect. I had never even heard of Mazatlan. They kept us on the plane for another four hours, hoping the flooding in CDMX would somehow subside.",
          "Eventually the passengers were released out into the wild, after someone called in the one security officer who had already gone home for the day. I got a messy stamp in my passport, some little paper to fill out, and rushed like a crazy person to the exit. It was a tiny airport, it was 3AM, and I was convinced there would be about three taxis.",
          "So out I ran and promised the first taxi driver I saw that I would pay him cash, even though I had exactly zero pesos on me, as long as he could take me to a decent hotel. He then drove for an hour, which at that point felt like it might be my final ride, but eventually we made it to the city of Mazatlan.",
          "I had never seen such a strange mix of Mexican outdoor culture and beachy Vegas all in one place. At some point my driver bumped into someone but decided not to get out of the car and instead sped away. Strange, yes, but I did not think much of it. I was too busy observing the human zoo that Mazatlan was at 4 in the morning on a Sunday night.",
          "After some major language hurdles, he understood that I was the one taking him for a ride with no pesos in my pocket and somehow still agreed to take me to an ATM and then to the \"nicest hotel\" in town.",
          "That nicest hotel turned out to be an absolute drug hole, but God bless, I had no clue. I checked in and had never been happier to see a bed.",
          "The next morning, getting up for my first early meeting, I opened the curtains and saw the ocean. I had no idea whether it was the Pacific or the Atlantic, and honestly, I did not care.",
          "Many meetings and airline calls and receding water at the CDMX airport later, I finally made it there. My Mexican team immediately gave me a hug and told me they were so happy I had made it out alive. I looked at them, stunned.",
          "They said, \"Well, Mazatlan is completely under cartel rule. We would never step foot there.\" It turned out the reason my driver kept driving after hitting another car was that if you get out, you get shot.",
          "I still do not know which guardian angel to thank for that one, but one thing is for sure. It was a blessing not to know.",
          "I still have not checked whether Mazatlan sits on the Pacific or the Atlantic, and at this point I am even more convinced that ignorance is bliss."
        ]
      },
      joy: {
        title: "Joy comes in the morning",
        paragraphs: [
          "It’s March 2026. I just turned 30. Never thought that day would come - but time has no mercy on any of us.",
          "I’m in a new studio apartment I just rented. Tiny. Less than 400 square feet. Back down to almost no belongings. Four years into my LA life, I had gone full circle: from arriving with two suitcases, to accumulating furniture and a whole life, back down to (almost) zero.",
          "Scott and I had just broken up, long story for another time. I left my furniture at his house, since by then it had all become ours anyway, packed my clothes into my car and drove off into this tiny furnished studio.",
          "Thirty years old. Single. Working a job that was slowly killing my soul, and my body — those 80 hour weeks are starting to weigh. My visa depends on it, so no way out of that.\nNo real home. No real belongings. Not even a teacup or a plate I could call my own.",
          "Things with my family are broken too. Promised myself I wouldn’t get into it, but before you think I am an awful human being, the fracture with my family originated in them not accepting my relationship with Scott. Now I lost both.",
          "Heartbroken, isolated, with no one in my corner. Just family and friends pitying me, blaming me, or quietly thinking my choices had brought me exactly where I deserved to be.",
          "All the devil’s voices are whispering in my ear. That I should never have come here. That my family was right. That I am now truly “past my expiration date” (thanks grandma & society for that language). That there is no other path for me than to crawl back to Europe, tail between my legs, pack away every dream I ever had and spend the rest of my life haunted by the future that could have been.",
          "I feel like I am coming undone. I’ve met depression before, I am very familiar with bathroom floor crying, but this time feels different. Bleaker. Like something in me was starting to go out.",
          "And then I did the only sane thing left to do.\nI went to bed.\nSleep comes eventually. After the spiraling and the tears and the crawling, it comes.",
          "And then morning comes too.",
          "Ah, the morning. What a glorious gift. Light through the blinds. Another God-given day.\nAnd in my mailbox that morning, my path into a new life.",
          "The green card.",
          "I didn’t tell anyone. Partly because they would not have understood. Partly because they would not have been happy for me. But mostly because it felt like something sacred. A private little wink from God. My joy. Mine to hold.",
          "God has a sense of humor. And always, He will bring joy in the morning."
        ]
      },
      cool: {
        title: "Don’t be cool",
        paragraphs: [
          "At 5 years old, I would show up to kindergarten with a notepad and mark down how the other kids would rate my dress of the day on a scale of 1 to 10, as well as what they liked and disliked. I was conducting surveys before I had learned how to write!",
          "I would then take my findings and recap them to my grandma, upon which we would come up with a new skirt design to sew together. It was wonderful.",
          "To my great disappointment, there was no linear improvement in my “cool” scores. The other kids would not necessarily like my new outfit more than the last one, and even if they did, me surveying them immediately offset that. I failed to climb the social ladder or figure out the equation for which skirt would finally rocket me to popularity.",
          "After many attempts, I gave up. I decided to redirect my effort to something more quantifiable and vowed to get 100% on my report cards, which I was told would be impossible.",
          "They were right, I ended first grade with 99.25% \nStill a better success rate than any of my prior attempts at improving my social status.",
          "Trying to be cool: finnicky, frustrating. \nBeing completely uncool: natural, always worth it."
        ]
      }
    };

    function openStory(trigger) {
      const story = stories[trigger.dataset.storyId];
      if (!story) return;

      storyTitle.textContent = story.title;
      storyBody.innerHTML = "";

      story.paragraphs.forEach(function (paragraph) {
        const p = document.createElement("p");
        p.textContent = paragraph;
        storyBody.appendChild(p);
      });

      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");
      storyBody.scrollTop = 0;
      closeButton.focus();
    }

    function closeStory() {
      overlay.classList.remove("is-open");
      overlay.setAttribute("aria-hidden", "true");
    }

    triggers.forEach(function (trigger) {
      trigger.addEventListener("click", function () {
        openStory(trigger);
      });

      trigger.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openStory(trigger);
        }
      });
    });

    closeButton.addEventListener("click", closeStory);

    overlay.addEventListener("click", function (event) {
      if (event.target === overlay) {
        closeStory();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeStory();
      }
    });
  </script>
</body>
</html>
